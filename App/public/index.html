<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Lines</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="canvas"></canvas>

<div id="controls">
    <div id="playBtn" class="btn paused" title="Play/Pause"></div>
    <div id="clearBtn" class="btn" title="Clear Canvas"></div>
</div>

<div id="soundControls">
    <button id="soundBtn1" class="sound-btn">Sound 1</button>
    <button id="soundBtn2" class="sound-btn">Sound 2</button>
</div>

<script src="script.js"></script>
</body>
</html>
